services:
  # --- PostgreSQL ---
  postgres:
    image: postgres:16-alpine
    container_name: photo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: photo_analysis
    ports:
      - "5435:5432"  # Внешний порт 5435 -> Внутренний 5432
    volumes:
      - pg_data:/var/lib/postgresql/data # Постоянное хранилище данных

  # --- MinIO ---
  minio:
    image: minio/minio:latest
    container_name: photo-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9101:9001"  # Web Console
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  nginx:
    image: nginx:alpine
    container_name: photo-nginx
    restart: unless-stopped
    ports:
      - "9100:9100"
    command: |
      /bin/sh -c "cat > /etc/nginx/conf.d/default.conf <<'EOF'
      server {
          listen 9100;
          location / {
              proxy_pass http://minio:9000;
              proxy_set_header Host minio:9000;
          }
      }
      EOF
      nginx -g 'daemon off;'"
    depends_on:
      - minio

  kafka:
    image: apache/kafka:latest
    container_name: photo-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,EXTERNAL://0.0.0.0:9094,CONTROLLER://localhost:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

  api:
    build: .
    container_name: photo-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      - kafka
      - postgres
      - minio
    environment:
      SERVICE_TIMEOUT: 10
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: postgres                # имя сервиса
      DB_PORT: 5432                     # внутренний порт postgres
      DB_NAME: photo_analysis
      MINIO_ENDPOINT: minio:9000       # имя сервиса + S3 API порт
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
      MINIO_BUCKET_NAME: photo-bucket
      MINIO_PUBLIC_URL: localhost:9100
      LOG_LEVEL: INFO
      DB_ECHO: "false"

# Объявляем тома (volumes), чтобы данные не терялись
volumes:
  pg_data:
  minio_data: