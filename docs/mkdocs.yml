site_name: Умная галерея
site_description: Photo analysis service documentation
site_author: Umnaya Galereya Team
repo_url: https://github.com/anomalyco/umnaya_galereya
docs_dir: src
site_dir: site

theme:
  name: material
  language: ru
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.code.copy

plugins:
  - search
  - mermaid2:
      version: 11.4.1
      arguments:
        theme:
          light: default
          dark: dark


markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.keys
  - tables
  - footnotes
  - attr_list
  - md_in_html

nav:
  - Главная: index.md
  - Быстрый старт: getting-started.md
  - Архитектура:
      - architecture.md
  - API: api.md
  - Развёртывание: deployment.md
  - Переменные окружения: environment.md
  - Структура проекта: project-structure.md
  - Метрики: metrics.md
