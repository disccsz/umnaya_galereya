syntax = "proto3";

package photo;

service PhotoAnalyzer {
    rpc AnalyzePhoto(AnalyzePhotoRequest) returns (AnalyzePhotoResponse);
}

message AnalyzePhotoRequest {
    string object_key = 1;          
}

message AnalyzePhotoResponse {
    int32 faces_count = 1;
    int32 eyes_closed_count = 2;
    bool is_blurred = 3;
    int32 blur_score = 4;
    string standard_hash = 5;
    string perceptual_hash = 6;
}
