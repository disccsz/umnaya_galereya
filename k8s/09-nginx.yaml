apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: umnaya
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 9100
          command:
            - /bin/sh
            - -c
            - |
              cat > /etc/nginx/conf.d/default.conf <<'EOF'
              server {
                  listen 9100;
                  location / {
                      proxy_pass http://minio:9000;
                      proxy_set_header Host minio:9000;
                  }
              }
              EOF
              nginx -g 'daemon off;'
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: umnaya
spec:
  selector:
    app: nginx
  ports:
    - port: 9100
      targetPort: 9100
  type: ClusterIP