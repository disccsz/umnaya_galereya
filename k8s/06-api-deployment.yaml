apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: umnaya
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      initContainers:
        - name: wait-postgres
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - until pg_isready -h postgres -U postgres; do echo waiting for postgres; sleep 2; done
          env:
            - name: PGPASSWORD
              value: "postgres"
        - name: alembic-upgrade
          image: umnaya-api:latest
          imagePullPolicy: IfNotPresent
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: umnaya-config
            - secretRef:
                name: umnaya-secret
      containers:
        - name: api
          image: umnaya-api:latest
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: umnaya-config
            - secretRef:
                name: umnaya-secret
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 15