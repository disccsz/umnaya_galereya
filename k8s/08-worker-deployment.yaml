apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: umnaya
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: umnaya-api:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.worker"]
          envFrom:
            - configMapRef:
                name: umnaya-config
            - secretRef:
                name: umnaya-secret